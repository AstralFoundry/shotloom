<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="tile" x1="180" y1="25" x2="830" y2="1000" gradientUnits="userSpaceOnUse">
    <stop stop-color="#C6C2FF"/><stop offset=".52" stop-color="#B4AEFF"/><stop offset="1" stop-color="#A49CFA"/>
  </linearGradient>
  <radialGradient id="blob" cx="0" cy="0" r="1" gradientTransform="matrix(480 590 -600 488 350 390)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#34333A"/><stop offset=".42" stop-color="#19191D"/><stop offset=".78" stop-color="#09090C"/><stop offset="1" stop-color="#020204"/>
  </radialGradient>
  <radialGradient id="blobLight" cx="0" cy="0" r="1" gradientTransform="matrix(500 420 -480 570 400 370)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#77747D" stop-opacity=".42"/><stop offset=".45" stop-color="#3A3940" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="antenna" x1="324" y1="205" x2="486" y2="354" gradientUnits="userSpaceOnUse">
    <stop stop-color="#09090C"/><stop offset=".42" stop-color="#242329"/><stop offset=".72" stop-color="#08080B"/><stop offset="1" stop-color="#020204"/>
  </linearGradient>
  <radialGradient id="eyeWhite" cx="0" cy="0" r="1" gradientTransform="matrix(150 154 -150 147 225 525)" gradientUnits="userSpaceOnUse">
    <stop offset=".72" stop-color="#FFFFFF"/><stop offset=".91" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F1F4"/>
  </radialGradient>
  <radialGradient id="pupil" cx="0" cy="0" r="1" gradientTransform="matrix(70 82 -78 67 260 548)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#45444B"/><stop offset=".48" stop-color="#17171B"/><stop offset="1" stop-color="#08080B"/>
  </radialGradient>
  <linearGradient id="ray" x1="688" y1="312" x2="758" y2="426" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fff"/><stop offset=".65" stop-color="#F5F5FF"/><stop offset="1" stop-color="#DAD9F7"/>
  </linearGradient>
  <filter id="ambient" x="-20%" y="-20%" width="150%" height="160%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="surface" x="-15%" y="-15%" width="130%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="8" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="grain">
      <feFuncA type="table" tableValues="0 .075"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
  </filter>
  <filter id="eyeShadow" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <filter id="rayShadow" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <clipPath id="tileClip"><rect x="38" y="30" width="949" height="948" rx="260"/></clipPath>
</defs>

<!-- rounded lavender app tile -->
<rect width="1024" height="1024" fill="#fff"/>
<rect x="38" y="30" width="949" height="948" rx="260" fill="url(#tile)"/>
<g clip-path="url(#tileClip)">
  <ellipse cx="390" cy="1010" rx="490" ry="65" fill="#827BEA" opacity=".28" filter="url(#ambient)"/>

  <!-- curled top sprout, integrated into the creature -->
  <path d="M322 354
    C298 317 292 267 308 230
    C326 187 372 166 423 170
    C470 174 501 201 499 241
    C497 277 473 309 446 310
    C426 311 411 293 395 293
    C371 291 354 310 359 335
    C362 350 377 361 394 369
    L336 388Z"
    fill="#050507" opacity=".48" filter="url(#soft)" transform="translate(2 9)"/>
  <path d="M322 354
    C298 317 292 267 308 230
    C326 187 372 166 423 170
    C470 174 501 201 499 241
    C497 277 473 309 446 310
    C426 311 411 293 395 293
    C371 291 354 310 359 335
    C362 350 377 361 394 369
    L336 388Z" fill="url(#antenna)"/>
  <path d="M313 275 C312 222 350 187 404 185 C441 184 470 200 482 226"
    stroke="#77747D" stroke-opacity=".22" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#soft)"/>

  <!-- main soft, asymmetrical blob -->
  <path d="M-18 646
    C-7 522 65 421 180 374
    C264 339 359 341 452 369
    C560 401 650 475 696 574
    C737 663 745 778 713 872
    C699 913 674 952 638 985
    H-18Z" fill="#08080B" opacity=".42" filter="url(#ambient)" transform="translate(0 16)"/>
  <path d="M-22 642
    C-5 518 68 420 182 374
    C265 340 359 342 451 369
    C558 400 649 474 696 573
    C738 663 746 778 713 872
    C700 915 673 954 637 982
    H-22Z" fill="url(#blob)" filter="url(#surface)"/>
  <path d="M-10 642
    C8 522 78 432 185 389
    C265 357 359 359 448 385
    C553 416 636 484 681 577"
    fill="none" stroke="#77747C" stroke-opacity=".16" stroke-width="9" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M-22 642
    C-5 518 68 420 182 374
    C265 340 359 342 451 369
    C558 400 649 474 696 573
    C738 663 746 778 713 872
    C700 915 673 954 637 982
    H-22Z" fill="url(#blobLight)"/>

  <!-- left eye socket shadow and rim -->
  <ellipse cx="247" cy="562" rx="135" ry="129" fill="#000" opacity=".62" filter="url(#eyeShadow)"/>
  <ellipse cx="247" cy="562" rx="127" ry="126" fill="#08080A"/>
  <ellipse cx="247" cy="561" rx="119" ry="118" fill="url(#eyeWhite)"/>
  <ellipse cx="247" cy="561" rx="119" ry="118" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".22"/>
  <ellipse cx="274" cy="572" rx="59" ry="60" fill="#000" opacity=".24" filter="url(#soft)"/>
  <ellipse cx="275" cy="572" rx="59" ry="60" fill="url(#pupil)"/>
  <circle cx="310" cy="555" r="13.5" fill="#fff"/>

  <!-- right eye -->
  <ellipse cx="537" cy="686" rx="120" ry="123" fill="#000" opacity=".6" filter="url(#eyeShadow)"/>
  <ellipse cx="537" cy="685" rx="116" ry="119" fill="#08080A"/>
  <ellipse cx="537" cy="685" rx="108" ry="111" fill="url(#eyeWhite)"/>
  <ellipse cx="537" cy="685" rx="108" ry="111" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".2"/>
  <ellipse cx="544" cy="689" rx="52" ry="55" fill="#000" opacity=".13" filter="url(#soft)"/>
  <ellipse cx="544" cy="689" rx="52" ry="55" fill="url(#pupil)"/>
  <circle cx="574" cy="675" r="12.5" fill="#fff"/>

  <!-- three raised white surprise marks -->
  <g>
    <path d="M698 410L739 328" stroke="#8D87D9" stroke-opacity=".22" stroke-width="57" stroke-linecap="round" filter="url(#rayShadow)" transform="translate(0 8)"/>
    <path d="M698 410L739 328" stroke="url(#ray)" stroke-width="54" stroke-linecap="round"/>
    <path d="M747 465L821 420" stroke="#8D87D9" stroke-opacity=".2" stroke-width="56" stroke-linecap="round" filter="url(#rayShadow)" transform="translate(0 8)"/>
    <path d="M747 465L821 420" stroke="url(#ray)" stroke-width="54" stroke-linecap="round"/>
    <path d="M770 549L834 555" stroke="#8D87D9" stroke-opacity=".2" stroke-width="52" stroke-linecap="round" filter="url(#rayShadow)" transform="translate(0 8)"/>
    <path d="M770 549L834 555" stroke="url(#ray)" stroke-width="50" stroke-linecap="round"/>
  </g>
</g>
</svg>