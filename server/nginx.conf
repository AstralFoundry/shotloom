log_format shotloom '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name shotloom.0xfiang.com;
    location /.well-known/acme-challenge/ { root /var/www/shotloom-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name shotloom.0xfiang.com;
    ssl_certificate /etc/letsencrypt/live/shotloom.0xfiang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shotloom.0xfiang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 32m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /assets/ {
        root /opt/shotloom/dist/renderer;
        expires 1y;
    }
    location /openreel/ {
        root /opt/shotloom/dist/renderer;
        expires -1;
    }
    location / {
        proxy_pass http://127.0.0.1:13030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    # OAuth codes and Storage signatures must not enter request logs.
    access_log /var/log/nginx/shotloom.access.log shotloom;
    error_log /var/log/nginx/shotloom.error.log;
}
