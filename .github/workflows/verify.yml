name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  product:
    # Exercise the official Seatbelt-backed Agent tests on a supported desktop OS.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - run: npm run verify:product
      - name: Share verified frontend with native tests
        uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: dist/renderer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  electron:
    needs: product
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - run: npm run typecheck:electron
      - run: npm run prepare:plugins
      - run: npm run prepare:harness
      - run: npm run prepare:media
      - run: npm run smoke:electron
      - run: npm run harness:verify-package
