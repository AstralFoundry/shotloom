name: Native Android acceptance smoke
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'Optional old preview run to reproduce the login hang before upgrading'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download latest signed preview for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --workflow native-preview.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run" && test "$run" != null
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name Shotloom-Android-Preview --dir acceptance
          cd acceptance && sha256sum --check SHA256SUMS
      - name: Download optional reproduction baseline
        if: inputs.baseline_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name Shotloom-Android-Preview --dir baseline
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Relay emulator DNS through the runner
        run: |
          python3 .github/scripts/emulator-dns.py --self-test
          sudo python3 .github/scripts/emulator-dns.py > "$RUNNER_TEMP/emulator-dns.log" 2>&1 &
          dns_pid=$!
          for attempt in {1..15}; do
            if python3 .github/scripts/emulator-dns.py --probe; then break; fi
            if ! kill -0 "$dns_pid" 2>/dev/null; then cat "$RUNNER_TEMP/emulator-dns.log"; exit 1; fi
            sleep 1
          done
          python3 .github/scripts/emulator-dns.py --probe
          cat "$RUNNER_TEMP/emulator-dns.log"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_SESSION_COOKIE: ${{ secrets.SHOTLOOM_ACCEPTANCE_SESSION }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 127.0.0.1
          disable-animations: true
          script: bash .github/scripts/native-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-launch-evidence
          path: |
            ${{ runner.temp }}/emulator-dns.log
            acceptance/launch-log.txt
            acceptance/window.xml
            acceptance/android-launch.png
            acceptance/build.txt
            acceptance/session-setup.txt
            acceptance/authenticated.xml
            acceptance/android-authenticated.png
            acceptance/android-current.png
            acceptance/baseline.xml
            acceptance/android-account.png
            acceptance/android-account-landscape.png
            acceptance/android-feedback-detail.png
            acceptance/feedback-detail.xml
            acceptance/android-feedback.png
            acceptance/android-records.png
            acceptance/android-records-empty.png
            acceptance/android-notifications*.png
            acceptance/android-notification-reply.png
            acceptance/android-session-reload.png
            acceptance/session-reload*.json
            acceptance/session-reload.xml
            acceptance/session-reload-cdp.txt
            acceptance/android-skills.png
            acceptance/android-skill-editor.png
            acceptance/skills.xml
            acceptance/skill-editor.xml
            acceptance/android-canvas*.png
            acceptance/canvas*.json
            acceptance/canvas*.xml
            acceptance/canvas-cdp.txt
            acceptance/account.xml
            acceptance/feedback.xml
            acceptance/records.xml
            acceptance/notifications.xml
          if-no-files-found: warn
          retention-days: 14
