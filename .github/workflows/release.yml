name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Package and release {0}', inputs.version) || format('Release {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本标签（必须与项目版本一致）"
        required: true
        default: "v0.1.2"
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Missing required updater signing secret: TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      - name: Validate version and tag availability
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must use a v-prefixed semantic version, for example v0.1.2"
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::Requested tag $RELEASE_TAG does not match project version v$package_version"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null)"; then
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                echo "::error::Tag $RELEASE_TAG already points to another commit and will not be overwritten"
                exit 1
              fi
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                echo "::error::Release $RELEASE_TAG already exists"
                exit 1
              fi
              echo "::notice::Resuming the incomplete $RELEASE_TAG release from this commit"
            fi
          fi

  build:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg,app
            artifact: release-macos-arm64
            updater_suffix: aarch64
            artifact-path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: macOS x64
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg,app
            artifact: release-macos-x64
            updater_suffix: x86_64
            artifact-path: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: --bundles nsis
            artifact: release-windows-x64
            updater_suffix: ""
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe*

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm run prepare:opencode

      - name: Detect Apple signing credentials
        id: apple_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing unsigned and unnotarized macOS artifacts; missing Apple credentials: ${missing[*]}"
          fi

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && steps.apple_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          keychain_path="$RUNNER_TEMP/shotloom-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build release assets
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          retryAttempts: 2
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify updater artifacts
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shopt -s nullglob
            archives=(src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/*.app.tar.gz)
            if (( ${#archives[@]} != 1 )) || [[ ! -f "${archives[0]}.sig" ]]; then
              echo "::error::Expected one signed macOS updater archive, found ${#archives[@]}"
              exit 1
            fi
            archive="${archives[0]}"
            renamed="${archive%.app.tar.gz}_${{ matrix.updater_suffix }}.app.tar.gz"
            mv "$archive" "$renamed"
            mv "$archive.sig" "$renamed.sig"
          fi

          updater_signatures=()
          while IFS= read -r -d '' path; do
            updater_signatures+=("$path")
          done < <(find src-tauri/target -type f -name '*.sig' -print0)
          if (( ${#updater_signatures[@]} != 1 )); then
            echo "::error::No signed updater artifact was generated. Check TAURI_SIGNING_PRIVATE_KEY and createUpdaterArtifacts."
            exit 1
          fi

      - name: Upload temporary release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            create_args=(
              --title "Shotloom $RELEASE_TAG"
              --generate-notes
            )
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              create_args+=(--target "$GITHUB_SHA")
            else
              create_args+=(--verify-tag)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${create_args[@]}"
          fi

          # Generate latest.json for Tauri updater
          version="${RELEASE_TAG#v}"
          latest='{"version":"'"$version"'","notes":"See https://github.com/AstralFoundry/shotloom/releases/tag/'"$RELEASE_TAG"'","pub_date":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","platforms":{'

          first=true
          platform_count=0
          while IFS= read -r -d '' sig; do
            base="${sig%.sig}"
            installer="$(basename "$base")"
            sig_content="$(cat "$sig")"

            case "$installer" in
              *aarch64*.app.tar.gz) platform="darwin-aarch64" ;;
              *x86_64*.app.tar.gz)  platform="darwin-x86_64" ;;
              *x64*.exe)       platform="windows-x86_64" ;;
              *)               echo "::warning::Unknown platform for $installer"; continue ;;
            esac

            url="https://github.com/AstralFoundry/shotloom/releases/download/$RELEASE_TAG/$installer"

            [[ "$first" == true ]] && first=false || latest+=','
            latest+='"'"$platform"'":{"signature":"'"$sig_content"'","url":"'"$url"'"}'
            ((platform_count += 1))
          done < <(find release-assets -type f -name '*.sig' -print0)
          latest+='}}'

          if (( platform_count != 3 )); then
            echo "::error::Expected 3 updater platforms, generated $platform_count"
            exit 1
          fi

          echo "$latest" > latest.json
          echo "::group::latest.json"
          cat latest.json
          echo "::endgroup::"

          gh release upload "$RELEASE_TAG" latest.json --clobber
