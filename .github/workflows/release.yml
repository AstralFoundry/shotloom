name: Release
run-name: Release ${{ inputs.version || github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号或标签；留空使用 package.json 版本。无需修改工作流。"
        required: false
        type: string
  push:
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
      mobileMatrix: ${{ steps.release.outputs.mobileMatrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY once in repository secrets."
            exit 1
          fi
      - name: Resolve release and platform matrix
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: node scripts/desktop-release.mjs metadata

  verify:
    needs: metadata
    uses: ./.github/workflows/verify.yml

  build:
    name: Package ${{ matrix.platform }}
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Apply tag version to build workspace
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: node scripts/desktop-release.mjs version
      - uses: ./.github/actions/setup-project
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm run prepare:media

      - name: Detect Apple signing credentials
        id: apple_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::Publishing ad-hoc signed, unnotarized macOS artifacts; missing Apple credentials: ${missing[*]}"
          fi

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && steps.apple_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          keychain_path="$RUNNER_TEMP/shotloom-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build desktop application
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          retryAttempts: 2
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Shotloom.app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Smoke test the packaged Agent runtime
        run: npm run harness:verify-package

      - name: Stage signed release assets
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          BUNDLE_DIR: src-tauri/target/${{ matrix.target }}/release/bundle
          BUNDLE_ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          ASSET_DIR: release-assets
        run: node scripts/desktop-release.mjs stage

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS' && steps.apple_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/shotloom-signing.keychain-db"
          rm -f "$RUNNER_TEMP/apple-certificate.p12"

  mobile:
    name: Package ${{ matrix.platform }}
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.mobileMatrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
          key: ${{ matrix.target }}
      - name: Configure mobile version and cloud origin
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SHOTLOOM_CLOUD_URL: ${{ vars.SHOTLOOM_CLOUD_URL }}
        run: node scripts/mobile-release.mjs
      - name: Generate mobile icons from the product icon
        run: node node_modules/@tauri-apps/cli/tauri.js icon src-tauri/icons/app.png --output mobile/src-tauri/icons

      - uses: actions/setup-java@v4
        if: matrix.mobile == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: matrix.mobile == 'android'
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        if: matrix.mobile == 'android'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build Android ARM64 APK
        if: matrix.mobile == 'android'
        working-directory: mobile
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          npm run tauri -- android build --apk --target aarch64 --ci -- --locked
      - name: Align, sign and verify Android APK
        if: matrix.mobile == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD; the keystore alias must be shotloom."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shotloom-android.jks"
          mapfile -t apks < <(find mobile/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release-unsigned.apk')
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one unsigned release APK."
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p mobile/build
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$RUNNER_TEMP/shotloom-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/shotloom-android.jks" \
            --ks-key-alias shotloom --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD --out mobile/build/Shotloom.apk \
            "$RUNNER_TEMP/shotloom-aligned.apk"
          "$tools/apksigner" verify --verbose mobile/build/Shotloom.apk
          "$tools/zipalign" -c -P 16 4 mobile/build/Shotloom.apk

      - name: Build unsigned iOS ARM64 IPA
        if: matrix.mobile == 'ios'
        working-directory: mobile
        run: |
          npm run tauri -- ios init --ci --skip-targets-install
          npm run tauri -- ios build --target aarch64 --no-sign --ci -- --locked

      - name: Stage mobile release assets
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          BUNDLE_DIR: ${{ matrix.mobile == 'android' && 'mobile/build' || 'mobile/src-tauri/gen/apple' }}
          ASSET_DIR: release-assets
        run: node scripts/desktop-release.mjs stage
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove Android signing material
        if: always() && matrix.mobile == 'android'
        run: rm -f "$RUNNER_TEMP/shotloom-android.jks" "$RUNNER_TEMP/shotloom-aligned.apk"

  publish:
    name: Verify assets and publish
    needs: [metadata, build, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          ASSET_DIR: release-assets
        run: node scripts/desktop-release.mjs publish
